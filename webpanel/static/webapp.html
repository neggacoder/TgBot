<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Бот</title>
<link rel="stylesheet" href="/static/webapp.css">
<!-- SDK Telegram: даёт тему клиента, кнопки и подписанные данные о том, кто
     открыл приложение. Если он не загрузится, приложение всё равно работает —
     данные тогда берутся из адресной строки (см. initData() в webapp.js). -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">
  <header class="head">
    <div class="who">
      <span class="avatar" id="avatar">·</span>
      <div class="who-text">
        <b id="who-name">Приложение</b>
        <span class="muted" id="who-chat">загружаем…</span>
      </div>
    </div>
    <select id="chat-select" class="chat-select" hidden></select>
  </header>

  <nav class="tabs" id="tabs" hidden>
    <button class="tab active" data-tab="me">Профиль</button>
    <button class="tab" data-tab="love">Пара</button>
    <button class="tab" data-tab="family">Семья</button>
    <button class="tab" data-tab="clan">Клан</button>
    <button class="tab" data-mtab="gamepets">Питомцы</button>
  </nav>

  <main id="view"><div class="skeleton"></div></main>

  <!-- Свой экран, а не содержимое #view: тот целиком перезаписывается каждой
       вкладкой (см. render()), а тут список питомцев и ответ действия должны
       жить порознь — ответ обновляется на месте, без перерисовки списка. -->
  <div id="mtab-gamepets" hidden>
    <div id="gamepets-list"><div class="skeleton"></div></div>
    <div id="gamepets-msg"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="/static/webapp.js"></script>
</body>
</html>
